[pytest]
# Run from the backend/ directory: `pytest`
# Tests rely on fixture blobs in <repo>/tests/fixtures/blobs/. The conftest
# enables USE_FIXTURE_BLOBS=1 automatically so no Azure connection is needed.
testpaths = tests
python_files = test_*.py
addopts = -ra --strict-markers
filterwarnings =
    ignore::DeprecationWarning
